<!DOCTYPE html>
<html>
    <head>
        <script src="create_file.js"></script>
    </head>
    <body>
        <form id="formularz">
            <label for="rodzaj_wn">Wybierz rodzaj wniosku</label>
            <select name="rodzaj_wn" id="rodzaj_wn">
                <option value="wyjazd">Wyjazd za granicę</option>
              <option value="urlop">Urlop nagrodowy</option>
              <option value="sluzba">Zaświadczenie o służbie</option>
            </select>
            <p>Z jaką datą chcesz złożyć</p>
            
            <input type="radio" id="dzis" value="dzis" name="dzien">
            <label for="dzis">Dzisiaj   </label>
            
            <input type="radio" id="jutro" value="jutro" name="dzien">
            <label for="jutro">Jutro   </label>
            
            <input type="radio" id="inny" value="inny" name="dzien">
            <label for="inny">Inna data   </label>
            <br>

            <label for="stopien">Twój stopień</label>
            <select name="stopien" id="stopien">
                <option value="sier">Sierżant</option>
                <option value="plut">Plutonowy</option>
                <option value="skpr">Starszy kapral</option>
                <option value="kpr">Kapral</option>
            </select>
            <br>
            
            <br>
            <label for="nazwisko">Twoje imię i nazwisko</label>
            <input type="text" id="nazwisko">

            <br>
            <label for="numer_tel">Numer telefonu</label>
            <input type="tel" id="numer_tel" pattern="[0-9]{9}" required/>
            
            <br><br>
            <input type="submit" value="Pobierz">
        </form>
    </body>
</html>
